<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Crypto | Institutional Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #0f071c;
            --card-border: rgba(138, 43, 226, 0.2);
            --accent-purple: #8A2BE2;
            --accent-glow: rgba(138, 43, 226, 0.35);
            --text-main: #FFFFFF;
            --text-muted: #8E78B3;
            --green: #00FF7F;
            --red: #FF4D4D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 90px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #16082b, #0b0415);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .company-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-frame {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-purple), #4a1594);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-fallback {
            font-weight: 800;
            font-size: 20px;
            color: #FFFFFF;
        }

        .company-info h1 {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .company-info p {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 2px;
        }

        .status-badge {
            background: rgba(0, 255, 127, 0.1);
            border: 1px solid rgba(0, 255, 127, 0.3);
            color: var(--green);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 14px;
            padding-bottom: 4px;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-item.active {
            background: linear-gradient(135deg, var(--accent-purple), #5a189a);
            color: #FFFFFF;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .section-pane { display: none; }
        .section-pane.active { display: block; }

        .corporate-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(138, 43, 226, 0.15);
            font-size: 14px;
        }

        .data-row:last-child { border-bottom: none; }
        .positive { color: var(--green); font-weight: 700; }
        .negative { color: var(--red); font-weight: 700; }

        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .input-control {
            width: 100%;
            background-color: #05020a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .btn-corporate {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), #5a189a);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .output-box {
            background-color: #05020a;
            border-left: 4px solid var(--accent-purple);
            padding: 14px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="company-branding">
            <div class="logo-frame">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback" style="display:none;">HC</span>
            </div>
            <div class="company-info">
                <h1>Hot Crypto Corp.</h1>
                <p>Institutional Terminal</p>
            </div>
        </div>
        <div class="status-badge">Enterprise</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-item active" onclick="switchSection('market', event)">Рынок</button>
        <button class="tab-item" onclick="switchSection('charts', event)">📈 График</button>
        <button class="tab-item" onclick="switchSection('calc', event)">Риск-менеджмент</button>
        <button class="tab-item" onclick="switchSection('account', event)">Профиль</button>
    </div>

    <!-- Секция 1: Рынок -->
    <div id="market" class="section-pane active">
        <div class="corporate-card">
            <div class="card-title">
                <span>Спотовый терминал (Bybit)</span>
                <span style="font-size: 10px; color: var(--green);">● REAL-TIME</span>
            </div>
            <div id="market-container">
                <div class="data-row"><span>Синхронизация шлюзов...</span></div>
            </div>
        </div>
    </div>

    <!-- Секция 2: График TradingView -->
    <div id="charts" class="section-pane">
        <div class="corporate-card">
            <div class="card-title"><span>Институциональный график (BTC/USDT)</span></div>
            <div class="tradingview-widget-container" style="height: 480px; width: 100%;">
                <!-- TradingView Mini Chart Widget BEGIN -->
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
                {
                  "symbols": [["Bitcoin|1W|BYBIT:BTCUSDT"]],
                  "chartOnly": false,
                  "width": "100%",
                  "height": "100%",
                  "locale": "ru",
                  "colorTheme": "dark",
                  "autosize": true,
                  "showVolume": true,
                  "showMA": false,
                  "hideDateRanges": false,
                  "hideMarketStatus": false,
                  "hideSymbolLogo": false,
                  "scalePosition": "right",
                  "scaleMode": "Normal",
                  "fontFamily": "-apple-system, BlinkMacSystemFont, sans-serif",
                  "fontSize": "10",
                  "noTimeScale": false,
                  "valuesTracking": "1",
                  "changeMode": "price-and-percent",
                  "chartType": "area",
                  "maLineColor": "#2962FF",
                  "maLineWidth": 1,
                  "maLength": 9,
                  "headerFontSize": "medium",
                  "backgroundColor": "rgba(15, 7, 28, 1)",
                  "gridColor": "rgba(138, 43, 226, 0.06)",
                  "lineWidth": 2,
                  "lineType": 0,
                  "dateRanges": ["1d|1", "1m|30", "3m|60", "12m|1D", "60m|1W"]
                }
                </script>
                <!-- TradingView Widget END -->
            </div>
        </div>
    </div>

    <!-- Секция 3: Калькулятор риска -->
    <div id="calc" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Расчет позиции и маржи</div>
            <div class="input-group">
                <label>Депозит (USDT)</label>
                <input type="number" id="calc-dep" class="input-control" value="1000">
            </div>
            <div class="input-group">
                <label>Допустимый риск (%)</label>
                <input type="number" id="calc-rs" class="input-control" value="2">
            </div>
            <div class="input-group">
                <label>Цена входа ($)</label>
                <input type="number" id="calc-en" class="input-control" value="65000">
            </div>
            <div class="input-group">
                <label>Уровень Stop-Loss ($)</label>
                <input type="number" id="calc-sl" class="input-control" value="63500">
            </div>
            <button class="btn-corporate" onclick="executeRiskCalculation()">Рассчитать позицию</button>
            <div id="calc-output" class="output-box" style="display: none;"></div>
        </div>
    </div>

    <!-- Секция 4: Профиль -->
    <div id="account" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Безопасность и аккаунт</div>
            <div class="data-row"><span style="color: var(--text-muted);">Пользователь:</span> <span id="user-nic" style="font-weight: 600;">Авторизация...</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Тип подписки:</span> <span style="color: var(--green); font-weight: 700;">PRO Enterprise</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Протокол шифрования:</span> <span style="font-weight: 600;">AES-256-GCM</span></div>
        </div>
    </div>

    <script>
        // @ts-nocheck
        const tgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tgApp) {
            tgApp.expand();
            if (tgApp.initDataUnsafe && tgApp.initDataUnsafe.user && tgApp.initDataUnsafe.user.first_name) {
                const userNicEl = document.getElementById('user-nic');
                if (userNicEl) {
                    userNicEl.innerText = tgApp.initDataUnsafe.user.first_name;
                }
            }
        }

        function switchSection(sectionId, event) {
            document.querySelectorAll('.section-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            
            const targetSection = document.getElementById(sectionId);
            if (targetSection) targetSection.classList.add('active');
            
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        async function fetchMarketData() {
            try {
                let response = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
                let resData = await response.json();
                let tickers = resData.result.list;
                let watchList = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "TONUSDT", "XRPUSDT"];
                let htmlContent = "";

                tickers.forEach(item => {
                    if (watchList.includes(item.symbol)) {
                        let priceVal = parseFloat(item.lastPrice).toLocaleString('en-US', {minimumFractionDigits: 2});
                        let changeVal = parseFloat(item.price24hPcnt) * 100;
                        let cssClass = changeVal >= 0 ? "positive" : "negative";
                        let prefix = changeVal >= 0 ? "+" : "";
                        let coinName = item.symbol.replace("USDT", "");
                        
                        htmlContent += `<div class="data-row">
                            <span><b>${coinName}</b> / USDT</span>
                            <span style="font-weight: 600;">$${priceVal}</span>
                            <span class="${cssClass}">${prefix}${changeVal.toFixed(2)}%</span>
                        </div>`;
                    }
                });
                
                const marketContainer = document.getElementById('market-container');
                if (marketContainer) {
                    marketContainer.innerHTML = htmlContent;
                }
            } catch (err) {
                const marketContainer = document.getElementById('market-container');
                if (marketContainer) {
                    marketContainer.innerHTML = `<div class="data-row">Ошибка получения данных API.</div>`;
                }
            }
        }

        function executeRiskCalculation() {
            const depInput = document.getElementById('calc-dep');
            const rsInput = document.getElementById('calc-rs');
            const enInput = document.getElementById('calc-en');
            const slInput = document.getElementById('calc-sl');

            if (!depInput || !rsInput || !enInput || !slInput) return;

            let depVal = parseFloat(depInput.value) || 0;
            let riskVal = parseFloat(rsInput.value) || 0;
            let entryVal = parseFloat(enInput.value) || 0;
            let stopLossVal = parseFloat(slInput.value) || 0;

            let riskUsdAmount = depVal * (riskVal / 100);
            let slDistance = entryVal > 0 ? Math.abs(entryVal - stopLossVal) / entryVal : 0;
            let positionSizeUsd = slDistance > 0 ? riskUsdAmount / slDistance : 0;
            let leverageSuggested = depVal > 0 ? Math.max(1, Math.ceil(positionSizeUsd / depVal)) : 1;

            let reportHtml = `
                <b>Параметры риск-менеджмента:</b><br>
                • Направление: <b>${stopLossVal < entryVal ? 'LONG 🟢' : 'SHORT 🔴'}</b><br>
                • Риск на капитал: <b>$${riskUsdAmount.toFixed(2)}</b> (${riskVal}%)<br>
                • Объем позиции: <b>$${positionSizeUsd.toFixed(2)}</b><br>
                • Рекомендуемое плечо: <b>до ${leverageSuggested}x</b>
            `;
            
            let boxElement = document.getElementById('calc-output');
            if (boxElement) {
                boxElement.style.display = 'block';
                boxElement.innerHTML = reportHtml;
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
