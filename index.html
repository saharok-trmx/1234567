<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Crypto | Institutional Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080310;
            --card-bg: #130624;
            --border-color: #2D144D;
            --accent-purple: #7B2CBF;
            --accent-glow: rgba(123, 44, 191, 0.25);
            --text-main: #F3F0FF;
            --text-muted: #9D8EC4;
            --green: #00E676;
            --red: #FF3D71;
            --gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .company-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-frame {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #4A1594, #240B4A);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-fallback {
            font-weight: 700;
            font-size: 20px;
            color: #FFFFFF;
        }

        .company-info h1 {
            font-size: 17px;
            font-weight: 600;
            color: #FFFFFF;
        }

        .company-info p {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-badge {
            background-color: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-item.active {
            background-color: var(--accent-purple);
            color: #FFFFFF;
            border-color: #9D4EDD;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .section-pane { display: none; }
        .section-pane.active { display: block; }

        .corporate-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(45, 20, 77, 0.4);
            font-size: 14px;
        }

        .data-row:last-child { border-bottom: none; }
        .positive { color: var(--green); font-weight: 600; }
        .negative { color: var(--red); font-weight: 600; }

        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-control, .select-control {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .btn-corporate {
            width: 100%;
            background: linear-gradient(135deg, #7B2CBF, #5A189A);
            color: #FFFFFF;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .output-box {
            background-color: var(--bg-color);
            border-left: 3px solid var(--accent-purple);
            padding: 12px;
            border-radius: 6px;
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Контейнер графика TradingView */
        .tradingview-widget-container {
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="company-branding">
            <div class="logo-frame">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback" style="display:none;">HC</span>
            </div>
            <div class="company-info">
                <h1>Hot Crypto Corp.</h1>
                <p>Institutional Terminal</p>
            </div>
        </div>
        <div class="status-badge">ENTERPRISE</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-item active" onclick="switchSection('market', event)">Рынок</button>
        <button class="tab-item" onclick="switchSection('charts', event)">📈 График</button>
        <button class="tab-item" onclick="switchSection('calc', event)">Риск-менеджмент</button>
        <button class="tab-item" onclick="switchSection('account', event)">Профиль</button>
    </div>

    <!-- Секция 1: Рынок -->
    <div id="market" class="section-pane active">
        <div class="corporate-card">
            <div class="card-title">
                <span>Спотовый терминал (Bybit)</span>
                <span style="font-size: 11px; color: var(--text-muted);">LIVE FEED</span>
            </div>
            <div id="market-container">
                <div class="data-row"><span>Синхронизация шлюзов...</span></div>
            </div>
        </div>
    </div>

    <!-- Секция 2: Живой график TradingView -->
    <div id="charts" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Живой график (BTC/USDT)</div>
            <div class="tradingview-widget-container">
                <!-- TradingView Widget BEGIN -->
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                  "autosize": true,
                  "symbol": "BYBIT:BTCUSDT",
                  "interval": "D",
                  "timezone": "Etc/UTC",
                  "theme": "dark",
                  "style": "1",
                  "locale": "ru",
                  "allow_symbol_change": true,
                  "calendar": false,
                  "support_host": "https://www.tradingview.com"
                }
                </script>
                <!-- TradingView Widget END -->
            </div>
        </div>
    </div>

    <!-- Секция 3: Калькулятор риска -->
    <div id="calc" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Институциональный расчет позиции</div>
            <div class="input-group">
                <label>Депозит (USDT)</label>
                <input type="number" id="calc-dep" class="input-control" value="1000">
            </div>
            <div class="input-group">
                <label>Допустимый риск (%)</label>
                <input type="number" id="calc-rs" class="input-control" value="2">
            </div>
            <div class="input-group">
                <label>Цена входа ($)</label>
                <input type="number" id="calc-en" class="input-control" value="65000">
            </div>
            <div class="input-group">
                <label>Уровень Stop-Loss ($)</label>
                <input type="number" id="calc-sl" class="input-control" value="63500">
            </div>
            <button class="btn-corporate" onclick="executeRiskCalculation()">Рассчитать позицию</button>
            <div id="calc-output" class="output-box" style="display: none;"></div>
        </div>
    </div>

    <!-- Секция 4: Профиль -->
    <div id="account" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Информация об учетной записи</div>
            <div class="data-row"><span style="color: var(--text-muted);">Пользователь:</span> <span id="user-nic">Авторизация...</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Тип подписки:</span> <span style="color: var(--green); font-weight: 600;">PRO Enterprise</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Шифрование:</span> <span>AES-256 Active</span></div>
        </div>
    </div>

    <script>
        // @ts-nocheck
        const tgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tgApp) {
            tgApp.expand();
            if (tgApp.initDataUnsafe && tgApp.initDataUnsafe.user && tgApp.initDataUnsafe.user.first_name) {
                const userNicEl = document.getElementById('user-nic');
                if (userNicEl) {
                    userNicEl.innerText = tgApp.initDataUnsafe.user.first_name;
                }
            }
        }

        function switchSection(sectionId, event) {
            document.querySelectorAll('.section-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            
            const targetSection = document.getElementById(sectionId);
            if (targetSection) targetSection.classList.add('active');
            
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        async function fetchMarketData() {
            try {
                let response = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
                let resData = await response.json();
                let tickers = resData.result.list;
                let watchList = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "TONUSDT", "XRPUSDT"];
                let htmlContent = "";

                tickers.forEach(item => {
                    if (watchList.includes(item.symbol)) {
                        let priceVal = parseFloat(item.lastPrice).toLocaleString('en-US', {minimumFractionDigits: 2});
                        let changeVal = parseFloat(item.price24hPcnt) * 100;
                        let cssClass = changeVal >= 0 ? "positive" : "negative";
                        let prefix = changeVal >= 0 ? "+" : "";
                        let coinName = item.symbol.replace("USDT", "");
                        
                        htmlContent += `<div class="data-row">
                            <span><b>${coinName}</b> / USDT</span>
                            <span>$${priceVal}</span>
                            <span class="${cssClass}">${prefix}${changeVal.toFixed(2)}%</span>
                        </div>`;
                    }
                });
                
                const marketContainer = document.getElementById('market-container');
                if (marketContainer) {
                    marketContainer.innerHTML = htmlContent;
                }
            } catch (err) {
                const marketContainer = document.getElementById('market-container');
                if (marketContainer) {
                    marketContainer.innerHTML = `<div class="data-row">Ошибка получения данных API.</div>`;
                }
            }
        }

        function executeRiskCalculation() {
            const depInput = document.getElementById('calc-dep');
            const rsInput = document.getElementById('calc-rs');
            const enInput = document.getElementById('calc-en');
            const slInput = document.getElementById('calc-sl');

            if (!depInput || !rsInput || !enInput || !slInput) return;

            let depVal = parseFloat(depInput.value) || 0;
            let riskVal = parseFloat(rsInput.value) || 0;
            let entryVal = parseFloat(enInput.value) || 0;
            let stopLossVal = parseFloat(slInput.value) || 0;

            let riskUsdAmount = depVal * (riskVal / 100);
            let slDistance = entryVal > 0 ? Math.abs(entryVal - stopLossVal) / entryVal : 0;
            let positionSizeUsd = slDistance > 0 ? riskUsdAmount / slDistance : 0;
            let leverageSuggested = depVal > 0 ? Math.max(1, Math.ceil(positionSizeUsd / depVal)) : 1;

            let reportHtml = `
                <b>Результат расчета:</b><br>
                • Направление: <b>${stopLossVal < entryVal ? 'LONG 🟢' : 'SHORT 🔴'}</b><br>
                • Риск на капитал: <b>$${riskUsdAmount.toFixed(2)}</b> (${riskVal}%)<br>
                • Объем позиции: <b>$${positionSizeUsd.toFixed(2)}</b><br>
                • Рекоменд. плечо: <b>до ${leverageSuggested}x</b>
            `;
            
            let boxElement = document.getElementById('calc-output');
            if (boxElement) {
                boxElement.style.display = 'block';
                boxElement.innerHTML = reportHtml;
            }
        }

        fetchMarketData();
        setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
