<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hot Crypto | Institutional Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #05020a;
            --card-bg: #11081f;
            --card-border: rgba(138, 43, 226, 0.28);
            --accent-purple: #8A2BE2;
            --accent-light: #A855F7;
            --accent-glow: rgba(138, 43, 226, 0.4);
            --text-main: #FFFFFF;
            --text-muted: #9D8EC4;
            --green: #00E676;
            --red: #FF3D71;
            --gold: #FFB300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #190a30, #0c0417);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 10px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
        }

        .company-branding {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-frame {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--accent-purple), #4a1594);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px var(--accent-glow);
            flex-shrink: 0;
        }

            .logo-frame img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .logo-fallback {
            font-weight: 800;
            font-size: 16px;
            color: #FFFFFF;
            display: none;
        }

        .company-info h1 {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .company-info p {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .status-badge {
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.35);
            color: var(--green);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 9px 4px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: 0.2s;
        }

            .tab-item.active {
                background: linear-gradient(135deg, var(--accent-purple), #5a189a);
                color: #FFFFFF;
                border-color: rgba(255, 255, 255, 0.35);
                box-shadow: 0 0 12px var(--accent-glow);
            }

        .section-pane {
            display: none;
        }

            .section-pane.active {
                display: block;
            }

        .corporate-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .metric-box {
            background: #090412;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-val {
            font-size: 15px;
            font-weight: 700;
            margin-top: 4px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(138, 43, 226, 0.14);
            font-size: 13px;
        }

            .data-row:last-child {
                border-bottom: none;
            }

        .positive {
            color: var(--green);
            font-weight: 700;
        }

        .negative {
            color: var(--red);
            font-weight: 700;
        }

        .chart-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .coin-pills {
            display: flex;
            gap: 4px;
        }

        .coin-pill {
            background: #090412;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

            .coin-pill.active {
                background: var(--accent-purple);
                color: #fff;
                border-color: var(--accent-light);
            }

        .btn-rotate {
            background: rgba(138, 43, 226, 0.2);
            color: #fff;
            border: 1px solid var(--accent-light);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: calc(100vh - 190px);
            min-height: 440px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            background: #090412;
        }

            .chart-wrapper.landscape-mode {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vh;
                height: 100vw;
                min-height: unset;
                z-index: 99999;
                border-radius: 0;
                border: none;
                transform: rotate(90deg) translateY(-100%);
                transform-origin: top left;
            }

        .exit-landscape-btn {
            display: none;
            position: absolute;
            top: 12px;
            right: 16px;
            z-index: 100000;
            background: rgba(255, 61, 113, 0.9);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .chart-wrapper.landscape-mode .exit-landscape-btn {
            display: block;
        }

        #tv-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 10px;
        }

            .input-group label {
                display: block;
                font-size: 10px;
                color: var(--text-muted);
                margin-bottom: 4px;
                font-weight: 600;
                text-transform: uppercase;
            }

        .input-control {
            width: 100%;
            background-color: #07030e;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .btn-corporate {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), #5a189a);
            color: #FFFFFF;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .output-box {
            background-color: #07030e;
            border-left: 3px solid var(--accent-purple);
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.6;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <header>
        <div class="company-branding">
            <div class="logo-frame">
                <img id="brand-logo" src="logo.png" alt="Logo">
                <span id="brand-fallback" class="logo-fallback">HC</span>
            </div>
            <div class="company-info">
                <h1>Hot Crypto Corp.</h1>
                <p>Institutional Terminal</p>
            </div>
        </div>
        <div class="status-badge">PRO LIVE</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-item active" onclick="openTab('market', this)">Рынок</button>
        <button class="tab-item" onclick="openTab('charts', this)">График</button>
        <button class="tab-item" onclick="openTab('calc', this)">Риск / PnL</button>
        <button class="tab-item" onclick="openTab('account', this)">Профиль</button>
    </div>

    <!-- 1. РЫНОК -->
    <div id="market" class="section-pane active">
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">Индекс страха (F&G)</div>
                <div class="metric-val" id="fng-val" style="color: var(--gold);">Загрузка...</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Лидер 24ч (Bybit)</div>
                <div class="metric-val" id="top-mover" style="color: var(--green);">Анализ...</div>
            </div>
        </div>

        <div class="corporate-card">
            <div class="card-title">
                <span>Спотовые котировки (Bybit)</span>
                <span style="font-size: 9px; color: var(--green);">● REAL-TIME</span>
            </div>
            <div id="market-container">
                <div class="data-row"><span>Синхронизация шлюзов...</span></div>
            </div>
        </div>
    </div>

    <!-- 2. ГРАФИК -->
    <div id="charts" class="section-pane">
        <div class="corporate-card" style="padding: 10px;">
            <div class="chart-controls">
                <div class="coin-pills">
                    <button class="coin-pill active" onclick="changeChartSymbol('BTCUSDT', this)">BTC</button>
                    <button class="coin-pill" onclick="changeChartSymbol('ETHUSDT', this)">ETH</button>
                    <button class="coin-pill" onclick="changeChartSymbol('SOLUSDT', this)">SOL</button>
                    <button class="coin-pill" onclick="changeChartSymbol('TONUSDT', this)">TON</button>
                </div>
                <button class="btn-rotate" onclick="toggleLandscapeChart()">🔄 Поворот 90°</button>
            </div>

            <div id="chart-box" class="chart-wrapper">
                <button class="exit-landscape-btn" onclick="toggleLandscapeChart()">✕ Свернуть</button>
                <iframe id="tv-iframe" src="about:blank" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- 3. КАЛЬКУЛЯТОР С ОТПРАВКОЙ В ЧАТ -->
    <div id="calc" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Институциональный калькулятор риска</div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Депозит ($)</label>
                    <input type="number" id="calc-dep" class="input-control" value="1000">
                </div>
                <div class="input-group">
                    <label>Риск (%)</label>
                    <input type="number" id="calc-rs" class="input-control" value="2">
                </div>
                <div class="input-group">
                    <label>Вход ($)</label>
                    <input type="number" id="calc-en" class="input-control" value="82500">
                </div>
                <div class="input-group">
                    <label>Stop-Loss ($)</label>
                    <input type="number" id="calc-sl" class="input-control" value="81000">
                </div>
            </div>
            <div class="input-group">
                <label>Take-Profit ($)</label>
                <input type="number" id="calc-tp" class="input-control" value="86500">
            </div>
            <button class="btn-corporate" onclick="executeRiskCalculation()">Рассчитать сделку</button>
            <div id="calc-output" class="output-box" style="display: none;"></div>
            <button id="send-to-chat-btn" class="btn-corporate" style="display:none; background: #00E676; color: #000; margin-top: 8px;" onclick="sendCalculationToChat()">📩 Отправить расчет в чат бота</button>
        </div>
    </div>

    <!-- 4. ПРОФИЛЬ -->
    <div id="account" class="section-pane">
        <div class="corporate-card">
            <div class="card-title">Профиль трейдера</div>
            <div class="data-row"><span style="color: var(--text-muted);">Имя:</span> <span id="user-nic" style="font-weight: 700;">Гость</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Telegram ID:</span> <span id="user-id">---</span></div>
            <div class="data-row"><span style="color: var(--text-muted);">Статус:</span> <span style="color: var(--green); font-weight: 700;">PRO Enterprise</span></div>
        </div>
    </div>

    <script>
                // @ts-nocheck
                var currentSymbol = "BTCUSDT";
                var chartInitialized = false;
                var lastCalcData = null;

                var logoImg = document.getElementById("brand-logo");
                var logoFallback = document.getElementById("brand-fallback");
                if (logoImg) {
                    logoImg.onerror = function() {
                        logoImg.style.display = "none";
                        if (logoFallback) logoFallback.style.display = "block";
                    };
                }

                var tgObj = window["Telegram"];
                var tgApp = tgObj && tgObj.WebApp ? tgObj.WebApp : null;
                if (tgApp) {
                    tgApp.expand();
                    var usr = tgApp.initDataUnsafe && tgApp.initDataUnsafe.user;
                    if (usr) {
                        var nicEl = document.getElementById("user-nic");
                        var idEl = document.getElementById("user-id");
                        if (nicEl && usr.first_name) nicEl.innerText = usr.first_name;
                        if (idEl && usr.id) idEl.innerText = String(usr.id);
                    }
                }

                function haptic(style) {
                    if (tgApp && tgApp.HapticFeedback) {
                        tgApp.HapticFeedback.impactOccurred(style || "light");
                    }
                }

                function buildTradingViewUrl(symbol) {
                    return "https://s.tradingview.com/widgetembed/?symbol=BYBIT:" + symbol + "&interval=60&theme=dark&style=1&locale=ru&toolbarbg=11081f&hide_side_toolbar=1&hide_legend=1&save_image=0&allow_symbol_change=1";
                }

                function openTab(sectionId, btnEl) {
                    haptic("light");
                    var panes = document.querySelectorAll(".section-pane");
                    for (var i = 0; i < panes.length; i++) panes[i].classList.remove("active");
                    var tabs = document.querySelectorAll(".tab-item");
                    for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");

                    var target = document.getElementById(sectionId);
                    if (target) target.classList.add("active");
                    if (btnEl) btnEl.classList.add("active");

                    if (sectionId === "charts" && !chartInitialized) {
                        var frame = document.getElementById("tv-iframe");
                        if (frame) {
                            frame.setAttribute("src", buildTradingViewUrl(currentSymbol));
                            chartInitialized = true;
                        }
                    }
                }

                function changeChartSymbol(sym, pillEl) {
                    haptic("light");
                    currentSymbol = sym;
                    var pills = document.querySelectorAll(".coin-pill");
                    for (var i = 0; i < pills.length; i++) pills[i].classList.remove("active");
                    if (pillEl) pillEl.classList.add("active");
                    var frame = document.getElementById("tv-iframe");
                    if (frame) frame.setAttribute("src", buildTradingViewUrl(sym));
                }

                function toggleLandscapeChart() {
                    haptic("medium");
                    var box = document.getElementById("chart-box");
                    if (box) box.classList.toggle("landscape-mode");
                }

                async function fetchMarketData() {
                    try {
                        var response = await fetch("https://api.bybit.com/v5/market/tickers?category=spot");
                        var resData = await response.json();
                        var tickers = resData.result.list;
                        var watchList = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "TONUSDT", "BNBUSDT"];
                        var htmlContent = "";
                        var bestCoin = "";
                        var bestChange = -999;

                        for (var i = 0; i < tickers.length; i++) {
                            var item = tickers[i];
                            if (watchList.indexOf(item.symbol) !== -1) {
                                var priceNum = parseFloat(item.lastPrice);
                                var priceVal = priceNum.toLocaleString("en-US", {minimumFractionDigits: 2});
                                var changeVal = parseFloat(item.price24hPcnt) * 100;
                                var cssClass = changeVal >= 0 ? "positive" : "negative";
                                var prefix = changeVal >= 0 ? "+" : "";
                                var coinName = item.symbol.replace("USDT", "");

                                if (changeVal > bestChange) {
                                    bestChange = changeVal;
                                    bestCoin = coinName + " (" + prefix + changeVal.toFixed(1) + "%)";
                                }

                                htmlContent += '<div class="data-row"><span><b>' + coinName + '</b>/USDT</span><span style="font-weight:700;">$' + priceVal + '</span><span class="' + cssClass + '">' + prefix + changeVal.toFixed(2) + '%</span></div>';
                            }
                        }
                        var mc = document.getElementById("market-container");
                        if (mc) mc.innerHTML = htmlContent;
                        var tm = document.getElementById("top-mover");
                        if (tm && bestCoin) tm.innerText = bestCoin;
                    } catch (err) {}
                }

                async function fetchFearAndGreed() {
                    try {
                        var r = await fetch("https://api.alternative.me/fng/?limit=1");
                        var d = await r.json();
                        var item = d.data[0];
                        var el = document.getElementById("fng-val");
                        if (el) el.innerText = item.value + "/100 (" + item.value_classification + ")";
                    } catch (e) {}
                }

                function executeRiskCalculation() {
                    haptic("medium");
                    var dep = parseFloat(document.getElementById("calc-dep").value) || 0;
                    var risk = parseFloat(document.getElementById("calc-rs").value) || 0;
                    var entry = parseFloat(document.getElementById("calc-en").value) || 0;
                    var sl = parseFloat(document.getElementById("calc-sl").value) || 0;
                    var tp = parseFloat(document.getElementById("calc-tp").value) || 0;

                    if (dep <= 0 || entry <= 0 || sl <= 0 || entry === sl) return;

                    var isLong = sl < entry;
                    var riskUsd = dep * (risk / 100);
                    var slDist = Math.abs(entry - sl) / entry;
                    var posSize = riskUsd / slDist;
                    var leverage = Math.max(1, Math.ceil(posSize / dep));
                    var profitUsd = posSize * (Math.abs(tp - entry) / entry);
                    var rr = riskUsd > 0 ? (profitUsd / riskUsd).toFixed(2) : "0";

                    lastCalcData = { coin: "BTC", entry: entry, tp: tp, pnl: profitUsd, roi: (profitUsd / dep) * 100 };

                    var reportHtml = "<b>Результат расчета:</b><br>" +
                        "• Направление: <b class='" + (isLong ? "positive" : "negative") + "'>" + (isLong ? "LONG 🟢" : "SHORT 🔴") + "</b><br>" +
                        "• Объем позиции: <b>$" + posSize.toFixed(2) + "</b><br>" +
                        "• Риск: <b class='negative'>-$" + riskUsd.toFixed(2) + "</b><br>" +
                        "• Потенциальный профит: <b class='positive'>+$" + profitUsd.toFixed(2) + "</b> (R:R = 1:" + rr + ")<br>" +
                        "• Плечо: <b>" + leverage + "x</b>";

                    var box = document.getElementById("calc-output");
                    if (box) { box.style.display = "block"; box.innerHTML = reportHtml; }
                    var sendBtn = document.getElementById("send-to-chat-btn");
                    if (sendBtn) sendBtn.style.display = "block";
                }

                function sendCalculationToChat() {
                    if (tgApp && lastCalcData) {
                        haptic("heavy");
                        var payload = JSON.stringify({ action: "save_trade", data: lastCalcData });
                        tgApp.sendData(payload);
                    }
                }

                fetchMarketData();
                fetchFearAndGreed();
                setInterval(fetchMarketData, 10000);
    </script>
</body>
</html>
